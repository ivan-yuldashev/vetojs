name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm type-bench
      - run: pnpm check:packaging
      - run: pnpm --filter "./examples/*" --fail-if-no-match run build
      - name: React 18
        run: |
          npm pkg set pnpm.overrides.react="^18" pnpm.overrides.react-dom="^18" pnpm.overrides.@types/react="^18" pnpm.overrides.@types/react-dom="^18"
          pnpm install --no-frozen-lockfile
          pnpm vitest run --project @vetojs/react
          pnpm typecheck:packages
